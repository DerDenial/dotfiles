# Generated from the current Quickshell wallpaper and semantic palette.
# Hyprlock 0.9.6: native PAM lock, no login-to-desktop handoff.
# Positive vertical positions move upward; percentage anchors match SDDM.

general {
    hide_cursor = true
    ignore_empty_input = true
    fail_timeout = 2000
}

animations {
    enabled = true
    bezier = soft, 0.22, 1, 0.36, 1
    animation = fadeIn, 1, 2, soft
    animation = fadeOut, 1, 2, soft
    animation = inputFieldColors, 1, 2, soft
    animation = inputFieldDots, 1, 2, soft
    animation = inputFieldWidth, 1, 2, soft
}

background {
    monitor =
    path = ~/Pictures/Wallpapers/Gruvbox/notch-default.png
    color = rgba(1d2021ff)
    blur_passes = 3
    blur_size = 8
    noise = 0.008
    contrast = 0.95
    brightness = 0.62
    vibrancy = 0.12
}

label {
    monitor =
    text = <span weight="600">$TIME</span>
    color = rgba(d4be98ff)
    font_size = 60
    font_family = Inter
    position = 0, 30%
    halign = center
    valign = center
    shadow_passes = 1
    shadow_size = 4
    shadow_color = rgba(00000040)
}

label {
    monitor =
    text = cmd[update:60000] date '+%A, %-d. %B'
    color = rgba(a89984ff)
    font_size = 11
    font_family = Inter
    position = 0, 21%
    halign = center
    valign = center
    shadow_passes = 1
    shadow_size = 3
    shadow_color = rgba(00000040)
}



label {
    monitor =
    text = <span weight="600">$USER</span>
    color = rgba(d4be98ff)
    font_size = 14
    font_family = Inter
    position = 0, -8
    halign = center
    valign = center
    shadow_passes = 1
    shadow_size = 3
    shadow_color = rgba(00000040)
}

input-field {
    monitor =
    size = 320, 52
    outline_thickness = 1
    inner_color = rgba(282828a6)
    outer_color = rgba(504945ff)
    font_color = rgba(d4be98ff)
    font_family = Inter
    placeholder_text = <span size="10752">Passwort</span>
    check_text = <span size="10752">Entsperren …</span>
    fail_text = <span size="10752">Passwort nicht erkannt</span>
    check_color = rgba(e78a4eff)
    fail_color = rgba(ea6962ff)
    capslock_color = rgba(e78a4eff)
    rounding = 18
    dots_size = 0.15
    dots_spacing = 0.35
    dots_center = true
    dots_rounding = -1
    fade_on_empty = false
    hide_input = false
    position = 0, -65
    halign = center
    valign = center
    shadow_passes = 1
    shadow_size = 5
    shadow_color = rgba(00000026)
}

label {
    monitor =
    text = Enter zum Entsperren
    color = rgba(a89984ff)
    font_size = 9
    font_family = Inter
    position = 0, -112
    halign = center
    valign = center
    shadow_passes = 1
    shadow_size = 3
    shadow_color = rgba(00000040)
}

label {
    monitor =
    text = $LAYOUT
    color = rgba(a89984cc)
    font_size = 9
    font_family = Inter
    position = 0, 28
    halign = center
    valign = bottom
}
