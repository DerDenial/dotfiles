# Lock with the same theme-aware helper used by Super + L and Settings.
# The helper keeps a per-session runtime lock for the whole Hyprlock process.
general {
    lock_cmd = python3 ~/.config/quickshell/LockScreen/lock.py
    before_sleep_cmd = loginctl lock-session
    after_sleep_cmd = hyprctl dispatch 'hl.dsp.dpms({ action = "enable" })'

    # Wait for the compositor to confirm a real session lock before sleep.
    # Explicit mode is needed because lock_cmd uses a wrapper script.
    inhibit_sleep = 3

    # Respect video playback, presentations and explicit idle inhibitors.
    ignore_dbus_inhibit = false
    ignore_systemd_inhibit = false
    ignore_wayland_inhibit = false
}

listener {
    timeout = 300
    on-timeout = loginctl lock-session
}

listener {
    timeout = 600
    on-timeout = hyprctl dispatch 'hl.dsp.dpms({ action = "disable" })'
    on-resume = hyprctl dispatch 'hl.dsp.dpms({ action = "enable" })'
}

# Suspend remains a manual action; closing the lid follows logind settings.
